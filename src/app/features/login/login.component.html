<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <img
        src="assets/Logo_Fabrixa_mas_chico_sin_fondo.png"
        alt="Fabrixa"
        class="logo"
      >
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" placeholder="tu@fabrixa.com" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" />
        </mat-form-field>

        <p class="error" *ngIf="error">{{ error }}</p>

        <button
          mat-flat-button
          color="primary"
          type="submit"
          class="full-width"
          [disabled]="form.invalid || cargando"
        >
          <mat-spinner *ngIf="cargando" diameter="20"></mat-spinner>
          <span *ngIf="!cargando">Ingresar</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
