<div class="page">
  <div class="page-header">
    <div class="titulo-con-volver">
      <app-back-button ruta="/"></app-back-button>
      <div>
        <h1>Horas no liquidadas</h1>
        <p class="subtitle">Total pendiente por empleado, agrupado</p>
      </div>
    </div>
  </div>

  <app-error-banner [mensaje]="error()" (cerrar)="error.set('')"></app-error-banner>

  <div class="content-card">
    <div class="loading-container" *ngIf="cargando()">
      <mat-spinner diameter="36"></mat-spinner>
    </div>

    <table mat-table [dataSource]="items()" *ngIf="!cargando() && items().length">
      <ng-container matColumnDef="empleado">
        <th mat-header-cell *matHeaderCellDef>Empleado</th>
        <td mat-cell *matCellDef="let i">{{ i.empleadoNombre }}</td>
      </ng-container>

      <ng-container matColumnDef="cantidadDias">
        <th mat-header-cell *matHeaderCellDef>Días cargados</th>
        <td mat-cell *matCellDef="let i">{{ i.cantidadDias }}</td>
      </ng-container>

      <ng-container matColumnDef="totalHoras">
        <th mat-header-cell *matHeaderCellDef>Total horas pendientes</th>
        <td mat-cell *matCellDef="let i" class="total">{{ i.totalHoras }} hs</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>

    <div class="empty-state" *ngIf="!cargando() && !items().length">
      <mat-icon>check_circle</mat-icon>
      <p>No hay horas pendientes de liquidar — todo al día.</p>
    </div>
  </div>
</div>
