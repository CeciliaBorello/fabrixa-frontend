<h2 mat-dialog-title>Registrar anticipo — {{ data.empleadoNombre }}</h2>
<div mat-dialog-content>
  <form [formGroup]="form" class="form-anticipo">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Monto</mat-label>
      <input matInput type="number" formControlName="monto" />
      <mat-error *ngIf="form.get('monto')?.hasError('required')">Ingresá un monto</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Fecha</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="fecha" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Motivo (opcional)</mat-label>
      <input matInput formControlName="motivo" />
    </mat-form-field>
  </form>

  <p class="error" *ngIf="error()">{{ error() }}</p>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-flat-button color="primary" [disabled]="form.invalid || guardando()" (click)="confirmar()">
    {{ guardando() ? 'Guardando...' : 'Registrar anticipo' }}
  </button>
</div>
