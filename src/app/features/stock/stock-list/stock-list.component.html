<div class="page">
  <div class="page-header">
    <div class="titulo-con-volver">
      <app-back-button ruta="/"></app-back-button>
      <div>
        <h1>Stock</h1>
        <p class="subtitle">Cantidad disponible de cada producto</p>
      </div>
    </div>
  </div>

  <div class="error-banner" *ngIf="error()">{{ error() }}</div>

  <div class="toolbar-lista">
    <div class="search-wrapper">
      <mat-icon class="search-icon">search</mat-icon>
      <input [formControl]="busquedaControl" placeholder="Buscar producto..." class="search-input" />
      <button *ngIf="busquedaControl.value" mat-icon-button class="clear-btn" (click)="busquedaControl.setValue('')">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <div class="content-card">
    <div class="loading-container" *ngIf="cargando()">
      <mat-spinner diameter="36"></mat-spinner>
    </div>

    <table mat-table [dataSource]="filas()" matSort (matSortChange)="onSortChange($event)" *ngIf="!cargando() && filas().length">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="productoNombre">Producto</th>
        <td mat-cell *matCellDef="let f">{{ f.productoNombre }}</td>
      </ng-container>

      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef mat-sort-header="cantidad">Cantidad</th>
        <td mat-cell *matCellDef="let f" [class.stock-bajo]="f.cantidad <= 0">
          {{ f.cantidad }}
        </td>
      </ng-container>

      <ng-container matColumnDef="unidad">
        <th mat-header-cell *matHeaderCellDef>Unidad</th>
        <td mat-cell *matCellDef="let f">{{ f.unidadMedida || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let f" class="actions">
          <button mat-icon-button (click)="verHistorial(f)" matTooltip="Ver historial">
            <mat-icon>history</mat-icon>
          </button>
          <button mat-icon-button (click)="ajustar(f)" matTooltip="Ajustar stock">
            <mat-icon>tune</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>

    <mat-paginator
      *ngIf="!cargando() && totalItems() > 0"
      [length]="totalItems()"
      [pageSize]="pageSize()"
      [pageIndex]="pageIndex()"
      [pageSizeOptions]="[10, 25, 50]"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>

    <div class="empty-state" *ngIf="!cargando() && !filas().length">
      <mat-icon>inventory_2</mat-icon>
      <p>No hay productos activos cargados todavía.</p>
    </div>
  </div>
</div>
