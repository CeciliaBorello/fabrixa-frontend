<div class="page">
  <div class="page-header">
    <div class="titulo-con-volver">
      <app-back-button ruta="/"></app-back-button>
      <div>
        <h1>Plan de Cuentas</h1>
        <p class="subtitle">Catálogo de cuentas contables</p>
      </div>
    </div>
    <div class="page-header-top">
      <button mat-flat-button color="primary" (click)="abrirNueva()">
        <mat-icon>add</mat-icon>
        Nueva cuenta
      </button>
    </div>
  </div>

  <app-error-banner [mensaje]="error()" (cerrar)="error.set('')"></app-error-banner>

  <div class="toolbar-lista">
    <div class="search-wrapper">
      <mat-icon class="search-icon">search</mat-icon>
      <input [formControl]="busquedaControl" placeholder="Buscar por código o nombre..." class="search-input" />
      <button *ngIf="busquedaControl.value" mat-icon-button class="clear-btn" (click)="busquedaControl.setValue('')">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="divider"></div>
    <label class="toggle-wrapper">
      <mat-slide-toggle [checked]="mostrarInactivas()" (change)="toggleMostrarInactivas()"></mat-slide-toggle>
      <span class="toggle-label">
        <mat-icon>{{ mostrarInactivas() ? 'visibility' : 'visibility_off' }}</mat-icon>
        Ver desactivadas
      </span>
    </label>
  </div>

  <div class="content-card">
    <div class="loading-container" *ngIf="cargando()">
      <mat-spinner diameter="36"></mat-spinner>
    </div>

    <table mat-table [dataSource]="todasLasCuentas()" *ngIf="!cargando() && todasLasCuentas().length">
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let c">{{ c.codigo }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let c" [class.con-padre]="c.cuentaPadreId">{{ c.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let c">{{ etiquetaTipo(c.tipo) }}</td>
      </ng-container>

      <ng-container matColumnDef="cuentaPadre">
        <th mat-header-cell *matHeaderCellDef>Cuenta padre</th>
        <td mat-cell *matCellDef="let c">{{ c.cuentaPadreNombre || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let c">
          <span class="estado-dot" [class.activo]="c.activo" [class.inactivo]="!c.activo"></span>
          {{ c.activo ? 'Activa' : 'Inactiva' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c" class="actions-cell">
          <div class="actions">
            <button mat-icon-button (click)="editar(c)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button (click)="toggleEstado(c)" [matTooltip]="c.activo ? 'Desactivar' : 'Reactivar'">
              <mat-icon>{{ c.activo ? 'block' : 'check_circle' }}</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>

    <div class="empty-state" *ngIf="!cargando() && !todasLasCuentas().length">
      <mat-icon>account_tree</mat-icon>
      <p>No hay cuentas contables cargadas todavía.</p>
      <button mat-stroked-button (click)="abrirNueva()">Crear la primera</button>
    </div>
  </div>
</div>
