<div class="page">
      <div class="titulo-con-volver">
        <app-back-button ruta="/"></app-back-button>
<div> 
  <div class="page-header">
    <h1>Historial de precios</h1>
    <p class="subtitle" *ngIf="nombreProducto()">{{ nombreProducto() }}</p>
  </div>

  <div class="content-card">
    <div class="loading-container" *ngIf="cargando()">
      <mat-spinner diameter="36"></mat-spinner>
    </div>

    <table mat-table [dataSource]="registros()" *ngIf="!cargando() && registros().length">
      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let r">{{ r.fecha | date:'dd/MM/yyyy HH:mm' }}</td>
      </ng-container>

      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let r">{{ r.precio | currency:'ARS' }}</td>
      </ng-container>

      <ng-container matColumnDef="usuario">
        <th mat-header-cell *matHeaderCellDef>Cargado por</th>
        <td mat-cell *matCellDef="let r">{{ r.usuarioNombre }}</td>
      </ng-container>

      <ng-container matColumnDef="motivo">
        <th mat-header-cell *matHeaderCellDef>Motivo</th>
        <td mat-cell *matCellDef="let r">{{ r.motivo || '-' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>

    <p class="empty-msg" *ngIf="!cargando() && !registros().length">
      Este producto todavía no tiene precios cargados.
    </p>
  </div>
</div>
