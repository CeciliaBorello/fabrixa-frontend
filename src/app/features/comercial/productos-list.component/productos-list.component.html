<div class="page">
  <div class="page-header">
    <div>
      <h1>Productos</h1>
      <p class="subtitle">Catálogo de productos de la fábrica</p>
    </div>
    <div class="page-header-top">
      <a mat-flat-button color="primary" routerLink="nuevo">
        <mat-icon>add</mat-icon>
        Nuevo
      </a>
    </div>
  </div>

  <div class="error-banner" *ngIf="error()">{{ error() }}</div>

  <div class="content-card">
    <div class="loading-container" *ngIf="cargando()">
      <mat-spinner diameter="36"></mat-spinner>
    </div>

    <table mat-table [dataSource]="items()" *ngIf="!cargando() && items().length">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let p">{{ p.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef>Categoría</th>
        <td mat-cell *matCellDef="let p">{{ p.categoria || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="codigoBarra">
        <th mat-header-cell *matHeaderCellDef>Código de barra</th>
        <td mat-cell *matCellDef="let p">{{ p.codigoBarra || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let p">
          <span class="estado-dot" [class.activo]="p.activo" [class.inactivo]="!p.activo"></span>
          {{ p.activo ? 'Activo' : 'Inactivo' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let p" class="actions">
          <a mat-icon-button [routerLink]="[p.id, 'editar']" matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </a>
          <button mat-icon-button (click)="toggleEstado(p)" [matTooltip]="p.activo ? 'Desactivar' : 'Reactivar'">
            <mat-icon>{{ p.activo ? 'block' : 'check_circle' }}</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>

    <div class="empty-state" *ngIf="sinResultados()">
      <mat-icon>inventory_2</mat-icon>
      <p>No hay productos cargados todavía.</p>
      <a mat-stroked-button routerLink="nuevo">Crear el primero</a>
    </div>
  </div>
</div>
