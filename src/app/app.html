<mat-toolbar class="app-toolbar" *ngIf="estaLogueado">
  <div class="brand">
    <div class="logo-container">
      <img src="assets/solo_F_mas_chico_sin_fondo.png" alt="Fabrixa" class="brand-logo" />
    </div>
    <span class="brand-name">Fabrixa</span>
  </div>

  <span class="spacer"></span>

  <a mat-icon-button routerLink="/" matTooltip="Ir al inicio" *ngIf="!enHome()">
    <mat-icon>home</mat-icon>
  </a>

  <button mat-icon-button [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
