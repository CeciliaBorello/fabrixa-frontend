<mat-toolbar class="app-toolbar" *ngIf="estaLogueado">
    <div class="brand">
        <div class="logo-container">
            <img src="assets/solo_F_mas_chico_sin_fondo.png" alt="Fabrixa" class="brand-logo" />
        </div>
        <span class="brand-name">Fabrixa</span>
    </div>

<nav class="nav-links">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
  <a routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
  <a routerLink="/clientes" routerLinkActive="active">Clientes</a>
  <a routerLink="/productos" routerLinkActive="active">Productos</a>
  <a routerLink="/pedidos" routerLinkActive="active">Pedidos</a>
  <a routerLink="/stock" routerLinkActive="active">Stock</a>
  <a routerLink="/fabricacion/ordenes" routerLinkActive="active">Orden Fabricación</a>
  <a routerLink="/fabricacion/formulas" routerLinkActive="active">Formulas
  </a>
</nav>

  <span class="spacer"></span>

  <button mat-icon-button [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>

<main class="app-content">
  <router-outlet />
</main>
